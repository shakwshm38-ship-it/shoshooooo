<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسئلة للشخص المفضل 💖</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffe6e9, #ffe3ec);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* خلفية القلوب المتطايرة */
        .heart-particle {
            position: absolute;
            bottom: -20px;
            font-size: 20px;
            animation: floatUp linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1.2);
                opacity: 0;
            }
        }

        /* كارت الأسئلة - ثابت وبأبعاد محددة لمنع اهتزاز الشاشة */
        .quiz-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(230, 80, 115, 0.15);
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 10;
            border: 2px solid #ffccd5;
        }

        h1 {
            color: #d6336c;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #ffe3ec;
            border-radius: 10px;
            margin: 15px 0 25px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: #ff4d6d;
            transition: width 0.4s ease;
        }

        .question-text {
            font-size: 19px;
            color: #4a4a4a;
            margin-bottom: 25px;
            line-height: 1.5;
            min-height: 60px;
        }

        .options-grid {
            display: grid;
            gap: 12px;
            max-height: 320px;
            overflow-y: auto;
            padding: 5px;
        }

        /* الأزرار بدون أي تأثيرات حركية قد تسبب اهتزاز */
        .option-btn {
            background: #fff;
            border: 2px solid #ffb3c1;
            color: #c9184a;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        .option-btn:hover {
            background: #ff4d6d;
            color: #fff;
            border-color: #ff4d6d;
        }

        /* خانة الكتابة الحرة */
        .text-input-area {
            width: 100%;
            height: 110px;
            padding: 15px;
            border: 2px solid #ffb3c1;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            resize: none;
            margin-bottom: 15px;
            color: #4a4a4a;
        }

        .text-input-area:focus {
            border-color: #ff4d6d;
        }

        .submit-btn {
            background: #ff4d6d;
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease;
        }

        .submit-btn:hover {
            background: #d6336c;
        }

        /* شاشة النتيجة */
        .result-screen {
            display: none;
        }

        .result-screen h2 {
            color: #ff4d6d;
            font-size: 28px;
            margin-bottom: 15px;
        }

        .result-screen p {
            color: #555;
            font-size: 19px;
            line-height: 1.6;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="quiz-card">
        <!-- شاشة الأسئلة -->
        <div id="quiz-screen">
            <h1>اختبار شخصي خاص 💕</h1>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
            <div class="question-text" id="questionText">جاري تحميل السؤال...</div>
            <div id="contentContainer"></div>
        </div>

        <!-- شاشة الختام -->
        <div id="result-screen" class="result-screen">
            <h2>🎉 انتهت الأسئلة!</h2>
            <p id="finalMessage"></p>
        </div>
    </div>

    <script>
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1569368931469369454/K-N4Xvub3xlkZesJDzf6HVVHeOwIXYgPo_iatlXiwboGbQwcP2eGZwwA7wTTqidpP2FO";

        const quizData = [
            {
                type: "options",
                question: "شنو أكثر شيء تحب تسويه وقت فراغك؟",
                options: ["نتكلم مع بعض", "نلعب مع بعض", "نسمع ميوزك", "نشوف فيلم"]
            },
            {
                type: "options",
                question: "شنو الأكلة المفضلة بالنسبة لك؟",
                options: ["بيتزا", "برجر", "ورق عنب", "شاورما"]
            },
            {
                type: "options",
                question: "ما هو برنامجك المفضّل؟",
                options: [
                    "سناب شات (Snapchat)",
                    "واتساب (WhatsApp)",
                    "إنستقرام (Instagram)",
                    "ديسكورد (Discord)",
                    "روبلوكس (Roblox)",
                    "يوتيوب (YouTube)",
                    "تيك توك (TikTok)"
                ]
            },
            {
                type: "options",
                question: "شنو المكان المفضل اللي تحب تروحه؟",
                options: ["البحر", "الكافيهات", "البيت والهدوء", "الحدائق"]
            },
            {
                type: "options",
                question: "كلمة واحدة توصف فيها يومك معي؟",
                options: ["سعادة", "راحة", "ضحك", "كل الأجوبة صحيحة ✨"]
            },
            {
                type: "text",
                question: "اكتب اللي بنفسك فيه بدون أي تردد ✍️❤️:",
                placeholder: "اكتب هنا كل اللي بخاطرك..."
            }
        ];

        let currentQuestion = 0;
        let userAnswers = [];

        function loadQuestion() {
            const current = quizData[currentQuestion];
            document.getElementById('questionText').innerText = current.question;
            
            const container = document.getElementById('contentContainer');
            container.innerHTML = '';

            if (current.type === "options") {
                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                current.options.forEach(option => {
                    const button = document.createElement('button');
                    button.className = 'option-btn';
                    button.innerText = option;
                    button.onclick = () => handleAnswer(current.question, option);
                    optionsGrid.appendChild(button);
                });
                container.appendChild(optionsGrid);

            } else if (current.type === "text") {
                const textarea = document.createElement('textarea');
                textarea.className = 'text-input-area';
                textarea.placeholder = current.placeholder;
                textarea.id = 'userInputText';

                const submitButton = document.createElement('button');
                submitButton.className = 'submit-btn';
                submitButton.innerText = 'إرسال الإجابة ✨';
                submitButton.onclick = () => {
                    const textValue = document.getElementById('userInputText').value.trim();
                    if (textValue === "") {
                        alert("اكتب شيئاً لطيفاً أولاً! ❤️");
                        return;
                    }
                    handleAnswer(current.question, textValue);
                };

                container.appendChild(textarea);
                container.appendChild(submitButton);
            }

            const progressPercent = (currentQuestion / quizData.length) * 100;
            document.getElementById('progress').style.width = `${progressPercent}%`;
        }

        function handleAnswer(question, answer) {
            userAnswers.push({ question, selectedAnswer: answer });

            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function sendToDiscord() {
            let fields = userAnswers.map((item, index) => {
                return {
                    name: `❓ السؤال ${index + 1}: ${item.question}`,
                    value: `✨ الإجابة: **${item.selectedAnswer}**`,
                    inline: false
                };
            });

            const payload = {
                username: "مساعد الأسئلة 💖",
                embeds: [{
                    title: "🎉 تم إكمال الاختبار بواسطة شوشو!",
                    color: 16731501,
                    fields: fields,
                    footer: {
                        text: "إشعار إجابات الموقع"
                    },
                    timestamp: new Date().toISOString()
                }]
            };

            fetch(DISCORD_WEBHOOK_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            }).catch(err => console.error("Error sending to Discord:", err));
        }

        function showResults() {
            document.getElementById('progress').style.width = `100%`;
            document.getElementById('quiz-screen').style.display = 'none';
            
            const resultScreen = document.getElementById('result-screen');
            resultScreen.style.display = 'block';
            
            // رسالة الختام لشوشو
            document.getElementById('finalMessage').innerText = 
                "شكراً لكي يا شوشو على المشاركة الجميلة هذي ❤️✨";

            sendToDiscord();
        }

        function createParticles() {
            const heartArray = ['❤️', '💖', '💕', '🌸', '✨'];
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.innerText = heartArray[Math.floor(Math.random() * heartArray.length)];
                heart.style.left = `${Math.random() * 100}vw`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                heart.style.animationDuration = `${4 + Math.random() * 4}s`;
                document.body.appendChild(heart);
            }
        }

        loadQuestion();
        createParticles();
    </script>
</body>
</html>
